{% if page_obj.has_other_pages %}
    <nav class="pagination" aria-label="Sahifalash">
        {% if page_obj.has_previous %}<a href="?{% if filter_query %}{{ filter_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">← Oldingi</a>{% else %}<span class="disabled">← Oldingi</span>{% endif %}
        <span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
        {% if page_obj.has_next %}<a href="?{% if filter_query %}{{ filter_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Keyingi →</a>{% else %}<span class="disabled">Keyingi →</span>{% endif %}
    </nav>
{% endif %}
